<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101127"><title>Party Pong Arcade</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 20%,#30366b,#0d1027 70%);color:white;font-family:system-ui,-apple-system,sans-serif;text-align:center;overflow:hidden}header{padding:12px 8px 4px}h1{font-size:clamp(22px,6vw,34px);margin:0;color:#ffe38a;text-shadow:0 2px 16px #ff4c8a}#info{font-size:14px;min-height:40px;padding:6px}canvas{display:block;margin:auto;touch-action:none;width:min(96vw,450px);height:min(66vh,650px);border:2px solid #626ad1;border-radius:18px;background:#141c3c;box-shadow:0 10px 30px #0008}nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px}button{background:#ffcc56;color:#15132e;border:0;border-radius:12px;padding:11px 13px;font-weight:800;font-size:13px}button.selected{background:#fa5f9d;color:white}#hint{font-size:12px;opacity:.8;margin:0 8px}</style></head><body><header><h1>🍻 PARTY PONG ARCADE</h1><div id="info">Wähle einen Modus und wirf den Ball!</div></header><canvas id="game" width="450" height="650"></canvas><nav><button id="solo" class="selected">🤖 Gegen Computer</button><button id="duo">👥 2 Spieler</button><button id="power">🔥 Feuerball</button><button id="freeze">❄️ Frostball</button><button id="reset">↻ Neustart</button></nav><p id="hint">Ball unten berühren, nach oben ziehen und loslassen. Spezialbälle: je 1× pro Spieler.</p><script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),info=document.querySelector('#info');let mode='solo',turn=0,cups=[],shot=null,drag=null,used=[[false,false],[false,false]],selected='normal',scores=[0,0],freezeTurns=0,over=false;const W=450,H=650;
function init(){cups=[[],[]];for(let p=0;p<2;p++)for(let row=0;row<4;row++)for(let i=0;i<=row;i++){let x=W/2+(i-row/2)*49,y=p===0?96+row*44:554-row*44;cups[p].push({x,y,alive:true,gold:row===0});}turn=0;shot=null;drag=null;used=[[false,false],[false,false]];selected='normal';scores=[0,0];freezeTurns=0;over=false;update();draw()}
function update(){info.textContent=over?`🏆 ${scores[0]>scores[1]?'Spieler 1':'Spieler 2'} gewinnt!`:`${turn===0?'Spieler 1':mode==='solo'?'Computer':'Spieler 2'} ist dran · Treffer ${scores[0]} : ${scores[1]}`;document.querySelector('#power').classList.toggle('selected',selected==='fire');document.querySelector('#freeze').classList.toggle('selected',selected==='ice');document.querySelector('#solo').classList.toggle('selected',mode==='solo');document.querySelector('#duo').classList.toggle('selected',mode==='duo')}
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#1b2854';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#5564a5';ctx.lineWidth=3;ctx.setLineDash([12,10]);ctx.beginPath();ctx.moveTo(18,H/2);ctx.lineTo(W-18,H/2);ctx.stroke();ctx.setLineDash([]);ctx.font='bold 17px system-ui';ctx.fillStyle='#b9c8ff';ctx.textAlign='center';ctx.fillText('GEGNER',W/2,33);ctx.fillText('SPIELER',W/2,H-18);for(let p=0;p<2;p++)for(let c of cups[p])if(c.alive){circle(c.x,c.y,20,c.gold?'#ffcd4d':p===0?'#fb5d9e':'#55c9f6');circle(c.x,c.y,13,'#2c244a');circle(c.x,c.y,9,c.gold?'#ffdf70':'#faf0f3')}let start=turn===0?{x:W/2,y:602}:{x:W/2,y:48};if(!shot){circle(start.x,start.y,14,selected==='fire'?'#ff713c':selected==='ice'?'#7feaff':'#fff');if(drag){ctx.strokeStyle='#ffec9a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.lineTo(drag.x,drag.y);ctx.stroke()}}else{circle(shot.x,shot.y,shot.kind==='fire'?19:14,shot.kind==='fire'?'#ff713c':shot.kind==='ice'?'#7feaff':'white')}}
function pos(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
canvas.addEventListener('pointerdown',e=>{if(shot||over||(mode==='solo'&&turn===1))return;canvas.setPointerCapture(e.pointerId);drag=pos(e);draw()});canvas.addEventListener('pointermove',e=>{if(!drag)return;drag=pos(e);draw()});canvas.addEventListener('pointerup',e=>{if(!drag)return;let end=pos(e),start={x:W/2,y:turn===0?602:48},dx=end.x-start.x,dy=end.y-start.y;drag=null;if((turn===0&&dy< -35)||(turn===1&&dy>35)){let dist=Math.min(230,Math.hypot(dx,dy));launch(start.x,start.y,dx/Math.max(1,Math.abs(dy))*5,turn===0?-Math.max(6,dist/15):Math.max(6,dist/15))}draw()});
function launch(x,y,vx,vy){if(shot||over)return;let kind=selected;let index=kind==='fire'?0:kind==='ice'?1:-1;if(index>=0)used[turn][index]=true;selected='normal';shot={x,y,vx,vy,kind,owner:turn};update();requestAnimationFrame(tick)}
function tick(){if(!shot)return;let s=shot;s.x+=s.vx;s.y+=s.vy;s.vx*=.997;if(s.x<14||s.x>W-14)s.vx*=-.8;let target=1-s.owner,hit=null;for(let c of cups[target])if(c.alive&&Math.hypot(s.x-c.x,s.y-c.y)<23){hit=c;break}if(hit){hit.alive=false;scores[s.owner]++;if(s.kind==='fire'){for(let c of cups[target])if(c.alive&&Math.hypot(c.x-hit.x,c.y-hit.y)<65){c.alive=false;scores[s.owner]++}}if(s.kind==='ice')freezeTurns=1;if(hit.gold)scores[s.owner]++;finish();return}if(s.y<0||s.y>H||Math.abs(s.x)>W+30){finish();return}draw();requestAnimationFrame(tick)}
function finish(){shot=null;if(!cups[0].some(c=>c.alive)||!cups[1].some(c=>c.alive)){over=true;update();draw();return}if(freezeTurns&&turn===0){freezeTurns=0;turn=0}else turn=1-turn;update();draw();if(mode==='solo'&&turn===1)setTimeout(ai,650)}
function ai(){if(over||turn!==1||shot)return;let available=cups[1].filter(c=>c.alive);if(!available.length)return;let c=available[Math.floor(Math.random()*available.length)],miss=Math.random()<.36,tx=c.x+(miss?(Math.random()-.5)*150:(Math.random()-.5)*27);let dy=480/11,steps=(c.y-48)/dy;launch(W/2,48,(tx-W/2)/steps,dy)}
function special(kind,index){if(over||shot||(mode==='solo'&&turn===1))return;if(used[turn][index]){info.textContent='Diesen Spezialball hast du bereits benutzt!';return}selected=selected===kind?'normal':kind;update();draw()}
document.querySelector('#power').onclick=()=>special('fire',0);document.querySelector('#freeze').onclick=()=>special('ice',1);document.querySelector('#reset').onclick=init;document.querySelector('#solo').onclick=()=>{mode='solo';init()};document.querySelector('#duo').onclick=()=>{mode='duo';init()};init();
</script></body></html>
